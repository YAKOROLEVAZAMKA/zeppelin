# Отдаёт боковой панели два файла: zeppelin-metastore.js и metastore-catalog.json.
# Ничего больше здесь не крутится — упадёт этот контейнер, Zeppelin не заметит.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Панель загружается на странице Zeppelin (порт 8085), а файлы берёт отсюда
    # (порт 8086) — для браузера это разные origin, поэтому нужен CORS-заголовок.
    # Тут только метаданные схемы, не данные; если хочется строже — впишите
    # вместо * конкретный адрес Zeppelin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache, must-revalidate" always;

    gzip on;
    gzip_types application/json application/javascript;
    gzip_min_length 1024;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        autoindex off;
        try_files $uri =404;
    }
}
